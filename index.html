<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neha ❤️</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4d6d,#ff85a2);
font-family:Arial,sans-serif;
overflow:hidden;
text-align:center;
}

.container{
background:rgba(255,255,255,.15);
padding:30px;
border-radius:20px;
backdrop-filter:blur(10px);
}

h1,h2,#message{
color:white;
}

button{
padding:12px 30px;
margin:10px;
border:none;
border-radius:25px;
font-size:18px;
cursor:pointer;
}

#yes{
background:#ff006e;
color:white;
}

#no{
background:white;
color:#ff006e;
}

#message{
display:none;
margin-top:20px;
}

.heart{
position:absolute;
font-size:20px;
animation:float 5s linear infinite;
}

@keyframes float{
from{transform:translateY(100vh);}
to{transform:translateY(-100px);}
}
</style>

</head>

<body>

<div class="container">
<h1>Neha ❤️</h1>
<h2>Will you be mine forever?</h2>

<button id="yes" onclick="yesClick()">Yes ❤️</button> <button id="no">No 😢</button>

<div id="message">
❤️ Thank You Neha ❤️<br><br>
You made Chiro the happiest person alive.<br><br>
Forever Yours,<br>
Chiro ❤️
</div>
</div>

<script>

setInterval(()=>{
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),5000);
},300);

document.getElementById("no").addEventListener("mouseover",()=>{
const btn=document.getElementById("no");
btn.style.position="absolute";
btn.style.left=Math.random()*(window.innerWidth-100)+"px";
btn.style.top=Math.random()*(window.innerHeight-50)+"px";
});

function yesClick(){
document.getElementById("message").style.display="block";
document.getElementById("yes").style.display="none";
document.getElementById("no").style.display="none";
}
</script>

</body>
</html>
